{% include 'overall_header.html' %}

<form method="post" action="">
	<div class="panel">
		<div class="inner">
			<h2>{{ lang('TOPICPASSWORD_LOGIN') }}</h2>
			<p>{{ lang('TOPICPASSWORD_LOGIN_EXPLAIN') }}</p>
			{% if S_ERROR %}
				<p class="error">{{ ERROR }}</p>
			{% endif %}
			<fieldset>
				<dl>
					<dt><label for="topic_password">{{ lang('TOPICPASSWORD') ~ lang('COLON') }}</label></dt>
					<dd><input type="password" name="topic_password" id="topic_password" class="inputbox autowidth" autocomplete="current-password" maxlength="72"></dd>
				</dl>
			</fieldset>
		</div>
	</div>
	<fieldset class="submit-buttons">
		<a href="{{ U_FORUM }}" class="button2">{{ lang('CANCEL') }}</a>
		<input type="submit" name="submit" value="{{ lang('SUBMIT') }}" class="button1"{% if S_TOPIC_PASSWORD_BLOCKED %} disabled{% endif %}>
		{{ S_FORM_TOKEN }}
	</fieldset>
</form>

{% include 'overall_footer.html' %}
